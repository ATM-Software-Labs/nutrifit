name = "nutrifit"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://nutri.trujillomingorance.com"
ALLOWED_ORIGINS = "https://nutri.trujillomingorance.com,https://nutrifit-ac9.pages.dev"
TURNSTILE_SITE_KEY = "0x4AAAAAAFPhRCuPz21TsJR5"
GEMINI_MODEL = "gemini-2.0-flash"
# El escáner de producción pide el ticket y sube la foto a este host.
# En localhost el handler no usa la pasarela.
VISION_GATEWAY_URL = "https://api.trujillomingorance.com"

[[d1_databases]]
binding = "DB"
database_name = "nutrifit-db"
database_id = "c7f77ed4-a5d0-4c3a-a686-ecc1fb77d1f1"
migrations_dir = "migrations"

[[d1_databases]]
binding = "ALIMENTOS"
database_name = "nutrifit-alimentos"
database_id = "4ca3a77e-63b4-4090-bfa2-05e4032860c4"

[ai]
binding = "AI"
