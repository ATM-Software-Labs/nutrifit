<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Creatina y Agua Diaria | NutriFit</title>
  <style>
    body { margin:0; padding:40px 20px; background:#0F172A; color:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display:flex; justify-content:center; }
    .card { background:#1E293B; border:1px solid #334155; border-radius:24px; max-width:480px; width:100%; padding:32px; box-sizing:border-box; }
    h1 { font-size:22px; margin:0 0 8px 0; color:#10B981; }
    p { color:#94A3B8; font-size:14px; margin:0 0 24px 0; }
    label { display:block; font-size:13px; color:#94A3B8; margin-bottom:8px; }
    input { width:100%; padding:14px; background:#0F172A; border:1px solid #334155; border-radius:12px; color:#fff; font-size:16px; box-sizing:border-box; margin-bottom:20px; outline:none; }
    .res { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .box { background:#0F172A; border:1px solid #334155; padding:16px; border-radius:14px; text-align:center; }
    .val { font-size:24px; font-weight:700; color:#10B981; }
    .lbl { font-size:12px; color:#94A3B8; margin-top:4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculadora de Creatina y Agua</h1>
    <p>Dosis recomendada: 0.1 g de creatina por kg de peso corporal.</p>
    <label>Tu peso corporal (kg):</label>
    <input type="number" id="peso" value="85" min="40" max="180" oninput="calcular()">
    <div class="res">
      <div class="box"><div class="val" id="creatina">8.5 g</div><div class="lbl">Creatina diaria</div></div>
      <div class="box"><div class="val" id="agua">3.0 L</div><div class="lbl">Agua recomendada</div></div>
    </div>
  </div>
  <script>
    function calcular() {
      const p = parseFloat(document.getElementById('peso').value) || 0;
      document.getElementById('creatina').innerText = (p * 0.1).toFixed(1) + ' g';
      document.getElementById('agua').innerText = ((p * 35) / 1000).toFixed(1) + ' L';
    }
  </script>
</body>
</html>
