apply plugin: 'com.android.application'

// NutriFit · versión y firma desde el entorno (CI) o gradle.properties locales.
// Nunca se versionan contraseñas ni el keystore (ver docs/ANDROID.md).
def prop = { String nombre, String envVar -> (project.findProperty(nombre) ?: System.getenv(envVar)) ?: null }
def nfVersionName = prop('nutrifitVersionName', 'NUTRIFIT_VERSION_NAME') ?: '1.0.0'
def nfVersionCode = (prop('nutrifitVersionCode', 'NUTRIFIT_VERSION_CODE') ?: '1') as Integer
def nfKeystore = prop('nutrifitKeystorePath', 'ANDROID_KEYSTORE_PATH')

android {
    namespace = "com.trujillomingorance.nutrifit"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.trujillomingorance.nutrifit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nfVersionCode
        versionName nfVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // minSdk 24: v1 no instala en ningún dispositivo admitido. v4 es un
            // archivo .idsig aparte (adb incremental), no viaja dentro del APK.
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
            if (nfKeystore) {
                storeFile file(nfKeystore)
                storePassword prop('nutrifitKeystorePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias prop('nutrifitKeyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword prop('nutrifitKeyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Sin ANDROID_KEYSTORE_PATH (o nutrifitKeystorePath), assembleRelease
            // queda sin firmar. Con el keystore de producción, firma v2+v3.
            if (nfKeystore) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
