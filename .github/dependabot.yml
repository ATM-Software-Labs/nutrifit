# Actualizaciones semanales agrupadas (lunes 07:00 Madrid). Las mayores van en PR aparte.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    labels: [dependencias]
    groups:
      menores-y-parches:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Madrid }
    labels: [dependencias]
    groups:
      acciones:
        patterns: ["*"]
