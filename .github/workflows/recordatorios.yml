name: Recordatorios (cron)
# RESPALDO. La ronda la dispara cada 5 min la alarma del Durable Object Reloj (Worker
# nutrifit-cron). GitHub retrasa mucho los cron programados (a veces horas), así que esto solo
# cubre huecos: la ronda es idempotente (recordatorios_envios) y tolera retrasos (franja fin + 90 min).
# Además hace el latido de Supabase (se omite si ya se hizo hace < 14 min).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar ronda de recordatorios
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 60 -X POST -H "x-cron-secret: $CRON_SECRET" -H 'content-type: application/json' \
            https://nutri.trujillomingorance.com/api/interno/cron
