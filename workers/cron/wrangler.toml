name = "nutrifit-cron"
main = "worker.ts"
compatibility_date = "2026-09-01"
# workers.dev solo expone /armar, protegido con x-cron-secret.
workers_dev = true

# Sin Cron Trigger: la cuenta ya usa sus 5 gratuitos. Lo sustituye la alarma del Durable Object Reloj.
[triggers]
crons = []

[[durable_objects.bindings]]
name = "RELOJ"
class_name = "Reloj"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Reloj"]

[vars]
APP_URL = "https://nutri.trujillomingorance.com"
# Secretos (wrangler secret put): CRON_SECRET (el mismo que en Pages).
# index.ts (ejecutar) lo importa Pages en /api/interno/cron; ya no es la entrada del Worker.
